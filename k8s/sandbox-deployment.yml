apiVersion: apps/v1
kind: Deployment

metadata:
  name: sandbox-deployment
  labels:
    app: sandbox-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sandbox-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: sandbox-api

    spec:
      serviceAccountName: resource-manager

      containers:
        - name: main-sandbox-container
          image: sandbox
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: REDIS_URL

            - name: SANDBOX_MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: SANDBOX_MONGO_URL


            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt
                  key: JWT_SECRET

            # Plain (non-secret) value — the S3 static website hosting
            # endpoint. Production sites are served directly from S3
            # (not Kubernetes), so this never changes once set —
            # unlike the old Cloudflare Tunnel URL, there's no need
            # to update this on every restart.
            - name: S3_WEBSITE_ENDPOINT
              value: "nexagent-bucket.s3-website.ap-south-1.amazonaws.com"

          resources:
            requests:
              cpu: "250m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "400Mi"

          livenessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10

          volumeMounts:
            - name: sandbox-storage
              mountPath: /app/data

      volumes:
        - name: sandbox-storage
          emptyDir: {}

      restartPolicy: Always